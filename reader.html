<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reader Mode Simulation</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background: #000000;
            color: #ffffff;
            transition: background 0.3s, color 0.3s;
        }
        #url-input {
            width: calc(100% - 40px);
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid #333;
            border-radius: 5px;
            background: #1e1e1e;
            color: #ffffff;
        }
        #url-input::placeholder {
            color: #777;
        }
        .button-container {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }
        .button-container button {
            padding: 10px 15px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        .button-container button:hover {
            background-color: #0056b3;
        }
        #webview {
            width: 100%;
            height: 60vh;
            border: none;
            display: none;
        }
        #reader-content {
            display: none;
            padding: 10px;
            background: #000000;
            position: relative;
            height: 100vh;
            overflow-y: auto;
        }
        #close-button {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 40px;
            height: 40px;
            background-color: #dc3545;
            color: white;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: bold;
            line-height: 1;
            opacity: 0.8;
            transition: opacity 0.2s;
            z-index: 1000;
        }
        #close-button:hover {
            background-color: #c82333;
            opacity: 1;
        }
        .hidden {
            display: none;
        }
        #extracted-text {
            white-space: pre-wrap; /* Preserve line breaks and spaces */
            line-height: 2.5; /* Increase line spacing */
            font-size: 26px; /* Increase text size */
            color: #ffffff; /* Ensure text is visible */
        }
    </style>
</head>
<body>

    <h1>Reader Mode Simulation</h1>
    <input type="text" id="url-input" placeholder="Enter website URL..." />
    <div class="button-container">
        <button id="fetch-button">Fetch Link</button>
        <button id="view-button">View Reader</button>
        <button id="select-url-button">Select URL</button>
    </div>

    <iframe id="webview"></iframe>
    <div id="reader-content">
        <button id="close-button">&times;</button>
        <div id="extracted-text"></div>
    </div>

    <script>
        const fetchButton = document.getElementById('fetch-button');
        const viewButton = document.getElementById('view-button');
        const selectUrlButton = document.getElementById('select-url-button');
        const webview = document.getElementById('webview');
        const readerContent = document.getElementById('reader-content');
        const extractedText = document.getElementById('extracted-text');
        const closeButton = document.getElementById('close-button');
        const body = document.body;

        let currentUrl = '';

        fetchButton.addEventListener('click', () => {
            const url = document.getElementById('url-input').value;
            if (url) {
                currentUrl = url;
                webview.src = url;
                webview.style.display = 'block'; // Show iframe when fetching link
                readerContent.style.display = 'none'; // Hide reader content
                document.querySelector('h1').style.display = 'block';
                document.getElementById('url-input').style.display = 'block';
                document.querySelector('.button-container').style.display = 'flex';

                // Add event listeners to the iframe
                webview.addEventListener('load', () => {
                    console.log('Iframe loaded:', webview.contentWindow.location.href);
                });

                webview.addEventListener('click', () => {
                    try {
                        console.log('Iframe URL on click:', webview.contentWindow.location.href);
                    } catch (error) {
                        console.error('Cannot access iframe URL due to cross-origin restrictions:', error);
                    }
                });
            } else {
                alert('Please enter a valid URL.');
            }
        });

        viewButton.addEventListener('click', () => {
            if (currentUrl) {
                webview.style.display = 'none'; // Hide iframe when in reader mode
                extractContent(currentUrl);
            } else {
                alert('Please fetch a link first.');
            }
        });

        selectUrlButton.addEventListener('click', () => {
            const urlInput = document.getElementById('url-input');
            urlInput.select(); // Select the text in the input field
        });

        closeButton.addEventListener('click', () => {
            readerContent.style.display = 'none';
            document.querySelector('h1').style.display = 'block';
            document.getElementById('url-input').style.display = 'block';
            document.querySelector('.button-container').style.display = 'flex';
        });

        function extractContent(url) {
            const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(url)}`;
            fetch(proxyUrl)
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Network response was not ok');
                    }
                    return response.json();
                })
                .then(data => {
                    const parser = new DOMParser();
                    const doc = parser.parseFromString(data.contents, 'text/html');
                    const body = doc.body;

                    // Find the most content-rich div
                    const selectedElement = findMostContentRichDiv(body);

                    // Extract text and remove empty lines
                    const textContent = selectedElement ? selectedElement.innerText.trim() : 'Content not found.';
                    const cleanedText = textContent
                        .split('\n') // Split by lines
                        .filter(line => line.trim() !== '') // Remove empty lines
                        .join('\n'); // Join lines back together

                    extractedText.innerText = cleanedText;

                    // Switch to reader mode
                    readerContent.style.display = 'block';
                    document.querySelector('h1').style.display = 'none';
                    document.getElementById('url-input').style.display = 'none';
                    document.querySelector('.button-container').style.display = 'none';
                })
                .catch(err => {
                    alert('Failed to extract content. Please check the URL or try a different one.');
                    console.error(err);
                });
        }

        function findMostContentRichDiv(element) {
            let maxScore = 0;
            let richestDiv = null;

            const divs = element.querySelectorAll('div');

            divs.forEach(div => {
                const text = div.innerText.trim();

                // Skip divs that have very little text
                if (text.length < 50) return;

                // Exclude elements that are likely navigation, ads, or footers
                const classOrId = (div.className + ' ' + div.id).toLowerCase();
                if (classOrId.includes('nav') || classOrId.includes('footer') || classOrId.includes('sidebar') || classOrId.includes('ads')) {
                    return;
                }

                // Calculate a score based on text length and number of child nodes
                const wordCount = text.split(/\s+/).filter(word => word.length > 0).length;
                const childCount = div.querySelectorAll('p, span, a').length; // Count meaningful child nodes
                const score = wordCount + childCount * 5; // Weight child nodes more heavily

                if (score > maxScore) {
                    maxScore = score;
                    richestDiv = div;
                }
            });

            return richestDiv;
        }
    </script>

</body>
</html>
